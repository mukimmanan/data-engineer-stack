services:
  # ------------------------------------------------------------
  # Kafka KRaft Node 0
  # ------------------------------------------------------------
  kafka-0:
    image: apache/kafka:4.2.2
    container_name: kafka-0
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka-0:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka-0:9093,1@kafka-1:9093,2@kafka-2:9093
      - CLUSTER_ID=MkU3OEVBNT-JENDU2OTA3M0
    volumes:
      - kafka_0_data:/var/lib/kafka/data
    networks:
      - kafka-network
      - shared-network
    restart: unless-stopped

  # ------------------------------------------------------------
  # Kafka KRaft Node 1
  # ------------------------------------------------------------
  kafka-1:
    image: apache/kafka:4.2.2
    container_name: kafka-1
    ports:
      - "9094:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka-1:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka-0:9093,1@kafka-1:9093,2@kafka-2:9093
      - CLUSTER_ID=MkU3OEVBNT-JENDU2OTA3M0
    volumes:
      - kafka_1_data:/var/lib/kafka/data
    networks:
      - kafka-network
      - shared-network
    restart: unless-stopped

  # ------------------------------------------------------------
  # Kafka KRaft Node 2
  # ------------------------------------------------------------
  kafka-2:
    image: apache/kafka:4.2.2
    container_name: kafka-2
    ports:
      - "9096:9092"
    environment:
      - KAFKA_NODE_ID=2
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka-2:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka-0:9093,1@kafka-1:9093,2@kafka-2:9093
      - CLUSTER_ID=MkU3OEVBNT-JENDU2OTA3M0
    volumes:
      - kafka_2_data:/var/lib/kafka/data
    networks:
      - kafka-network
      - shared-network
    restart: unless-stopped

  # ------------------------------------------------------------
  # Confluent Schema Registry
  # ------------------------------------------------------------
  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.0
    container_name: schema-registry
    ports:
      - "8081:8081"
    environment:
      - SCHEMA_REGISTRY_HOST_NAME=schema-registry
      - SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS=kafka-0:9092,kafka-1:9092,kafka-2:9092
    networks:
      - kafka-network
      - shared-network
    depends_on:
      - kafka-0
      - kafka-1
      - kafka-2
    restart: unless-stopped

  # ------------------------------------------------------------
  # Debezium Connect for PostgreSQL CDC
  # ------------------------------------------------------------
  kafka-connect:
    image: debezium/connect:3.0.0.Final
    container_name: kafka-connect
    ports:
      - "8083:8083"
    environment:
      - BOOTSTRAP_SERVERS=kafka-0:9092,kafka-1:9092,kafka-2:9092
      - GROUP_ID=1
      - CONFIG_STORAGE_TOPIC=my_connect_configs
      - OFFSET_STORAGE_TOPIC=my_connect_offsets
      - STATUS_STORAGE_TOPIC=my_connect_statuses
      - KEY_CONVERTER=org.apache.kafka.connect.json.JsonConverter
      - VALUE_CONVERTER=org.apache.kafka.connect.json.JsonConverter
    depends_on:
      - kafka-0
      - kafka-1
      - kafka-2
      - schema-registry
    networks:
      - kafka-network
      - shared-network
    restart: unless-stopped

  # ------------------------------------------------------------
  # Conduktor Console - Kafka UI
  # ------------------------------------------------------------
  conduktor-console:
    image: conduktor/conduktor-console:latest
    container_name: conduktor-console
    ports:
      - "8088:8080"
    volumes:
      - ./platform-config.yaml:/opt/conduktor/platform-config.yaml:ro
    environment:
      - CDK_IN_CONF_FILE=/opt/conduktor/platform-config.yaml
      - CDK_DATABASE_URL=postgresql://conduktor:conduktor_pass@postgres:5432/conduktor_db
    networks:
      - kafka-network
      - shared-network
    restart: unless-stopped
    depends_on:
      - kafka-0
      - kafka-1
      - kafka-2
      - schema-registry

volumes:
  kafka_0_data:
  kafka_1_data:
  kafka_2_data:

networks:
  kafka-network:
    driver: bridge
  shared-network:
    external: true
    name: shared-network
