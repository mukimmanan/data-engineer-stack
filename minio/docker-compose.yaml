services:
  minio:
    build:
      context: .
      dockerfile: Dockerfile
    image: custom-minio:latest
    container_name: minio
    ports:
      - "9000:9000" # S3 API port
      - "9001:9001" # MinIO Console port
    env_file:
      - .env
    volumes:
      - ./data:/data # Mount host directory to container data directory
      - ./init-minio.sh:/usr/bin/init-minio.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - minio-network
      - shared-network

networks:
  minio-network:
    driver: bridge
    name: minio-network
  shared-network:
    external: true
    name: shared-network
