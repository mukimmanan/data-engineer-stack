services:
  hive-metastore:
    image: custom-hive:4.0.1
    build:
      context: ./hive-metastore
      dockerfile: Dockerfile
    container_name: hive-metastore
    environment:
      - SERVICE_NAME=metastore
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-password}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-your_secure_postgres_password}
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
    ports:
      - "9083:9083"
    networks:
      - trino-network
      - shared-network
    depends_on:
      hive-init:
        condition: service_completed_successfully

  hive-init:
    image: custom-hive:4.0.1
    build:
      context: ./hive-metastore
      dockerfile: Dockerfile
    container_name: hive-init
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-password}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-your_secure_postgres_password}
    networks:
      - trino-network
      - shared-network
    command: /opt/hive/bin/schematool -dbType postgres -initSchema --verbose || true
      
  trino-coordinator:
    image: trinodb/trino:483
    hostname: trino-coordinator
    container_name: trino-coordinator
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-password}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-your_secure_postgres_password}
      - POSTGRES_USER=${POSTGRES_USER:-primary_user}
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
    volumes:
      - ./conf/coordinator/config.properties:/etc/trino/config.properties:ro
      - ./conf/coordinator/node.properties:/etc/trino/node.properties:ro
      - ./conf/coordinator/catalog/:/etc/trino/catalog/
      - ./conf/coordinator/data/:/var/lib/trino/data/
    ports:
      - "8093:8080" # Exposed port for clients and Web UI
    networks:
      - trino-network
      - shared-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://trino-coordinator:8080/v1/status"]
      interval: 10s
      timeout: 5s
      retries: 5
    
  trino-worker-1:
    image: trinodb/trino:483
    hostname: trino-worker-1
    container_name: trino-worker-1
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-password}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-your_secure_postgres_password}
      - POSTGRES_USER=${POSTGRES_USER:-primary_user}
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
    volumes:
      - ./conf/worker/config.properties:/etc/trino/config.properties:ro
      - ./conf/worker/node.properties:/etc/trino/node.properties:ro
      - ./conf/worker/data/:/var/lib/trino/data/
      - ./conf/coordinator/catalog/:/etc/trino/catalog/
    networks:
      - trino-network
      - shared-network
    depends_on:
      trino-coordinator:
        condition: service_healthy

networks:
  shared-network:
    external: true
    name: shared-network
  trino-network:
    driver: bridge
    name: trino-network

