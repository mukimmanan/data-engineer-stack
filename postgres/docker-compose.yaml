services:
  postgres:
    image: postgres:16.15-alpine
    container_name: postgres
    command: postgres -c wal_level=logical
    env_file:
      - .env
    volumes:
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
      - postgres_data:/var/lib/postgresql/data 
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-primary_user} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - db_network
      - shared-network

volumes:
  postgres_data:

networks:
  db_network:
    driver: bridge
    name: db_network
  shared-network:
    external: true
    name: shared-network



