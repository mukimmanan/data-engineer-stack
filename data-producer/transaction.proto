syntax = "proto3";
package finance;

message User {
    string user_id = 1;
    string full_name = 2;
    string email = 3;
    string ip_address = 4;
}

message Location {
    string country = 1;
    string city = 2;
    double latitude = 3;
    double longitude = 4;
}

message Transaction {
    string transaction_id = 1;
    int64 timestamp = 2;
    double amount = 3;
    string currency = 4;
    string merchant = 5;
    string transaction_type = 6;
    bool is_flagged_fraud = 7;
    User user = 8;
    Location location = 9;
    string device_type = 10;
}
