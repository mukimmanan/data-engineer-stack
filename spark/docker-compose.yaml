services:
  spark-master:
    image: customer-spark:4.2.0
    container_name: spark-master
    hostname: spark-master
    ports:
      - "7077:7077"
      - "9983:8080"
    environment:
      - SPARK_ROLE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-root_user}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-root_password}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 3G
    user: "0:0"
    networks:
      - spark-network
      - shared-network
    volumes:
      - ./entrypoint.sh:/entrypoint.sh
      - ./analyticsaccelerator-s3-1.3.1.jar:/opt/spark/jars/analyticsaccelerator-s3-1.3.1.jar:ro
      - ./logs/log4j2.properties:/opt/spark/conf/log4j2.properties:ro
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./notebooks:/notebooks
      - ../trino/hive-metastore/hive-site.xml:/opt/spark/conf/hive-site.xml:ro

  spark-worker-1:
    image: customer-spark:4.2.0
    container_name: spark-worker-1
    hostname: spark-worker-1
    depends_on:
      - spark-master
    ports:
      - "9981:8081"
    environment:
      - SPARK_ROLE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-root_user}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-root_password}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 3G
    user: "0:0"
    networks:
      - spark-network
      - shared-network
    volumes:
      - ./entrypoint.sh:/entrypoint.sh
      - ./analyticsaccelerator-s3-1.3.1.jar:/opt/spark/jars/analyticsaccelerator-s3-1.3.1.jar:ro
      - ./logs/log4j2.properties:/opt/spark/conf/log4j2.properties:ro
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./notebooks:/notebooks
      - ../trino/hive-metastore/hive-site.xml:/opt/spark/conf/hive-site.xml:ro

  spark-worker-2:
    image: customer-spark:4.2.0
    container_name: spark-worker-2
    hostname: spark-worker-2
    depends_on:
      - spark-master
    ports:
      - "9982:8081"
    environment:
      - SPARK_ROLE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-root_user}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-root_password}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 3G
    user: "0:0"
    networks:
      - spark-network
      - shared-network
    volumes:
      - ./entrypoint.sh:/entrypoint.sh
      - ./analyticsaccelerator-s3-1.3.1.jar:/opt/spark/jars/analyticsaccelerator-s3-1.3.1.jar:ro
      - ./logs/log4j2.properties:/opt/spark/conf/log4j2.properties:ro
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./notebooks:/notebooks
      - ../trino/hive-metastore/hive-site.xml:/opt/spark/conf/hive-site.xml:ro
      
  spark-history-server:
    image: customer-spark:4.2.0
    container_name: spark-history-server
    hostname: spark-history-server
    depends_on:
      - spark-master
    ports:
      - "18080:18080"
    environment:
      - SPARK_ROLE=history
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-root_user}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-root_password}
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
    user: "0:0"
    networks:
      - spark-network
      - shared-network
    volumes:
      - ./entrypoint.sh:/entrypoint.sh
      - ./analyticsaccelerator-s3-1.3.1.jar:/opt/spark/jars/analyticsaccelerator-s3-1.3.1.jar:ro
      - ./logs/log4j2.properties:/opt/spark/conf/log4j2.properties:ro
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ../trino/hive-metastore/hive-site.xml:/opt/spark/conf/hive-site.xml:ro
  zepellin:
    image: customer-spark:4.2.0
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zeppelin_server
    hostname: zeppelin_server
    user: "0:0"
    ports:
      - "8085:8080"  # Zeppelin Web UI
    networks:
      - spark-network
      - shared-network
    environment:
      - SPARK_ROLE=zeppelin
      - USE_HADOOP=false
      - ZEPPELIN_ADDR=0.0.0.0
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-root_user}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-root_password}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-primary_password}
    volumes:
      - ./entrypoint.sh:/entrypoint.sh
      - ./analyticsaccelerator-s3-1.3.1.jar:/opt/spark/jars/analyticsaccelerator-s3-1.3.1.jar:ro
      - ./logs/log4j2.properties:/opt/spark/conf/log4j2.properties:ro
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./zep_conf/interpreter.json:/opt/zeppelin/conf_seed/interpreter.json:ro
      - ./zep_notebooks:/opt/zeppelin/notebook
      - ./notebooks:/notebooks
      - ../trino/hive-metastore/hive-site.xml:/opt/spark/conf/hive-site.xml:ro
    command: ["zeppelin", "/opt/zeppelin/bin/zeppelin.sh"]


networks:
  spark-network:
    driver: bridge
    name: spark-network
  shared-network:
    external: true
    name: shared-network





