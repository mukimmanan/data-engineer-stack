# Event Logging Configuration
spark.eventLog.enabled                                        true
spark.loglevel                                                OUTPUT
spark.eventLog.dir                                            s3a://logging/spark-events/
spark.eventLog.compress                                       true

# History Server Configuration
spark.history.fs.logDirectory                                 s3a://logging/spark-events/
spark.history.ui.port                                         18080
spark.history.fs.update.interval                              10s
spark.history.fs.cleaner.enabled                              true
spark.history.fs.cleaner.interval                             7d
spark.history.fs.cleaner.maxAge                               7d

# Network Configuration
spark.driver.host                                             spark-master
spark.driver.bindAddress                                     0.0.0.0

# MinIO S3 Configuration
spark.hadoop.fs.s3a.impl                                      org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.endpoint                                  http://minio:9000
spark.hadoop.fs.s3a.access.key                                ${MINIO_ROOT_USER}
spark.hadoop.fs.s3a.secret.key                                ${MINIO_ROOT_PASSWORD}
spark.hadoop.fs.s3a.path.style.access                         true
spark.hadoop.fs.s3a.aws.credentials.provider                  org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
spark.hadoop.fs.s3a.connection.ssl.enabled                    false
spark.hadoop.fs.s3a.attempts.maximum                          3
spark.hadoop.fs.s3a.retry.interval.seconds                    1

# Hive Metastore Configuration (Central Lakehouse Catalog like AWS Glue)
spark.sql.catalogImplementation                               hive
spark.hadoop.hive.metastore.uris                              thrift://hive-metastore:9083
spark.sql.warehouse.dir                                       s3a://staging/databases/
spark.sql.hive.metastore.version                              4.0.1
spark.sql.hive.metastore.jars                                 path
spark.sql.hive.metastore.jars.path                            /opt/spark/hive-spark-jars/*

# Apache Iceberg Catalog Configuration
spark.sql.catalog.postgres_catalog                            org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.postgres_catalog.type                       jdbc
spark.sql.catalog.postgres_catalog.uri                        jdbc:postgresql://postgres:5432/iceberg_db
spark.sql.catalog.postgres_catalog.jdbc.user                  iceberg
spark.sql.catalog.postgres_catalog.jdbc.password              ${POSTGRES_PASSWORD}
spark.sql.catalog.postgres_catalog.warehouse                  s3a://staging/iceberg-warehouse/

# Extensions & Delta Lake Hive Catalog Integration
spark.sql.extensions                                          org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions,io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog                               org.apache.spark.sql.delta.catalog.DeltaCatalog
spark.sql.catalog.delta                                       org.apache.spark.sql.delta.catalog.DeltaCatalog
